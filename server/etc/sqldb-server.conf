# ============================================================
# sqldb-server 默认配置
#
# 这份文件的值就是**内置默认值**（server/config.cpp 的 kDefaultsIni）。
# 构建时会复制一份到 build/svr/etc/sqldb-server.conf；
# tests/test_server/test_config.cpp 有一条用例逐键比对两份，防止漂移。
#
# 语法：[section] + `key = value`；'#' 或 ';' 开头是注释；空行忽略。
# 未知 section 合法（别的组件的自留地），已知 section 里拼错的 key 会在
# 启动时被 validate() 拦下并报出字段名。
# ============================================================

[server]
# 监听地址（host:port）。命令行 --listen= 可以临时覆盖它。
listen = 127.0.0.1:5433

# 最大并发连接数。
max_connections = 256

# 连接空闲多久后关掉（毫秒）；0 = 不超时。
idle_timeout_ms = 300000

# 事务里挂着不动多久后回滚并关连接（毫秒）；0 = 不超时。
# 注意：事务挂着会把 leveldb 的旧版本钉住，一般不要设 0。
idle_in_transaction_timeout_ms = 30000

# 日志级别，是**上限**：error < warn < info < debug。
#   error  只打错误
#   warn   错误 + 警告
#   info   再加：启动/退出汇总、空闲超时（默认）
#   debug  再加：每条连接的 accept/close（排障时用）
log_level = info

# 日志文件（**append** 方式打开，每条日志一次 write()，追加是原子）。
# 留空 = 写 stderr（开发时直接看终端）。
# 想看 debug：把上面改成 `log_level = debug`，再设一个 log_file，例如
#   log_file = ./sql_db/server.log
log_file =

[storage]
# leveldb | mock。mock 是进程内内存引擎，重启就没了（测试/开发用）。
engine = leveldb

# leveldb 数据目录（engine = mock 时忽略）。
path = ./sql_db

# 目录不存在时自动建。
create_if_missing = true

[execution]
# 只读语句跑在几条线程上（读线程池大小）。
read_threads = 1

# 读服务队列上限（满了就把该条语句以 busy 拒掉，不阻塞事件循环）。
read_queue_max = 1024

# 写/解析服务队列上限。
write_queue_max = 1024

# 单条语句最多回多少行（防止一个 SELECT * 把内存打爆）。
max_result_rows = 1000000

# 单条语句超时（毫秒）；0 = 不限。真正打断要等执行器有协作检查点。
statement_timeout_ms = 0

[session]
# 新连接建立后自动 USE 的库；留空 = 不自动选库。
default_database =

[raft]
# 是否把存储切到 Raft（multi-raft 的 P1）。默认 false：
# 关掉时启动路径与以前完全一致（server 直接用本地 KVStore）。
# 打开后必须同时给出 node_id / peers / log_path。
enabled = false

# 本节点在组内的 id（必须出现在下面的 peers 里）。
node_id = 1

# Raft 自己的监听地址（**独立端口**，不要和 server.listen 共用：两者的
# 超时/背压/鉴权完全不同，混在一个端口要把 SQL 帧解析器污染成内部流量搬运工）。
listen = 127.0.0.1:5434

# 静态成员表：node_id@host:port，逗号分隔。所有节点必须用同一份列表，
# 启动顺序任意；已经跑起来的集群不能靠改这个文件加成员（成员变更是 P3）。
peers =

# 每个节点**客户端可达**的 SQL 地址（node_id@host:port）。本节点不是 leader
# 时，服务端用它回 "NotLeader + 去哪个节点"，客户端自动重连过去。
# 留空 = 只报错，不给重定向目标（客户端只能自己换地址重试）。
sql_endpoints =

# 数据分片表（P2 M1 静态分片）："<start>,<end>,<group_id>; ..."，分号分隔。
# 每个条目给 group_id（>=1）一段 [start,end) 的 key range；@system/* 固定归
# 0 号组，数据 range 不得覆盖它。留空 = 单 group（全部键归 0 号组）。
shards =

# 选举超时与心跳间隔（毫秒），heartbeat_ms 必须小于 election_timeout_ms。
election_timeout_ms = 1000
heartbeat_ms = 100

# Raft 日志 / HardState 的独立 LevelDB 目录。
# 不要和 [storage] path 复用同一个目录：日志和业务状态机的生命周期不同。
log_path =

# 日志条目数超过该值时，leader/follower 各自生成快照并压缩日志
# （0 = 关闭压缩）。落后/新节点靠 InstallSnapshot 追赶。
snapshot_entries = 0

# proposal / read 等待预算（毫秒）。0 = 回退到 election_timeout_ms。
# 分区里的旧 leader 不会自己降级，等待必须有上限；读写可分别配置。
proposal_timeout_ms = 0
read_timeout_ms = 0
