# ============================================================
# sqldb-server 默认配置
#
# 这份文件的值就是**内置默认值**（server/config.cpp 的 kDefaultsIni）。
# 构建时会复制一份到 build/svr/etc/sqldb-server.conf；
# tests/test_server/test_config.cpp 有一条用例逐键比对两份，防止漂移。
#
# 语法：[section] + `key = value`；'#' 或 ';' 开头是注释；空行忽略。
# 未知 section 合法（别的组件的自留地），已知 section 里拼错的 key 会在
# 启动时被 validate() 拦下并报出字段名。
# ============================================================

[server]
# 监听地址（host:port）。命令行 --listen= 可以临时覆盖它。
listen = 127.0.0.1:5433

# 最大并发连接数。
max_connections = 256

# 连接空闲多久后关掉（毫秒）；0 = 不超时。
idle_timeout_ms = 300000

# 事务里挂着不动多久后回滚并关连接（毫秒）；0 = 不超时。
# 注意：事务挂着会把 leveldb 的旧版本钉住，一般不要设 0。
idle_in_transaction_timeout_ms = 30000

# 日志级别，是**上限**：error < warn < info < debug。
#   error  只打错误
#   warn   错误 + 警告
#   info   再加：启动/退出汇总、空闲超时（默认）
#   debug  再加：每条连接的 accept/close（排障时用）
log_level = info

# 日志文件（**append** 方式打开，每条日志一次 write()，追加是原子）。
# 留空 = 写 stderr（开发时直接看终端）。
# 想看 debug：把上面改成 `log_level = debug`，再设一个 log_file，例如
#   log_file = ./sql_db/server.log
log_file =

[storage]
# leveldb | mock。mock 是进程内内存引擎，重启就没了（测试/开发用）。
engine = leveldb

# leveldb 数据目录（engine = mock 时忽略）。
path = ./sql_db

# 目录不存在时自动建。
create_if_missing = true

[execution]
# 只读语句跑在几条线程上（读线程池大小）。
read_threads = 1

# 读服务队列上限（满了就把该条语句以 busy 拒掉，不阻塞事件循环）。
read_queue_max = 1024

# 写/解析服务队列上限。
write_queue_max = 1024

# 单条语句最多回多少行（防止一个 SELECT * 把内存打爆）。
max_result_rows = 1000000

# 单条语句超时（毫秒）；0 = 不限。真正打断要等执行器有协作检查点。
statement_timeout_ms = 0

[session]
# 新连接建立后自动 USE 的库；留空 = 不自动选库。
default_database =
